---
- name: Install and configure Docker
  tags: [deploy, install, clone]
  block:
    - name: Remove broken docker repo if exists
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/docker.sources
        state: absent

    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
          - python3-debian
        state: present
        update_cache: yes

    - name: Add Docker repository (deb822 format)
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/debian
        suites: bookworm
        components: stable
        architectures: amd64
        signed_by: https://download.docker.com/linux/debian/gpg
        state: present

    - name: Install Docker Engine and Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure devops directory exists
      ansible.builtin.file:
        path: "{{ devops_dir }}"
        state: directory
        mode: '0755'

    # --- СНАЧАЛА КЛОНИРУЕМ ---
    - name: Clone repositories
      ansible.builtin.git:
        repo: "https://github.com/{{ git_user }}/{{ item }}.git"
        dest: "{{ devops_dir }}/{{ item }}"
        version: "{{ git_branch }}"
        force: yes
      loop:
        - backend
        - frontend
        - DevOps

    # --- ПОТОМ СОЗДАЁМ ПАПКУ И ФАЙЛ ---
    - name: Ensure data directory exists
      ansible.builtin.file:
        path: "{{ devops_dir }}/DevOps/data"
        state: directory
        mode: '0755'

    - name: Ensure data.txt exists
      ansible.builtin.file:
        path: "{{ devops_dir }}/DevOps/data/data.txt"
        state: touch
        mode: '0644'